[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lilygo-lpm"
version = "0.1.0"
description = "The standard project manager for LILYGO UI applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LILYGO" }]
keywords = ["lilygo", "cmake", "package-manager", "embedded-linux"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
lpm = "lpm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lpm"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

